services:
  prometheus:
    image: prom/prometheus
    container_name: prom
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts.yml:/etc/prometheus/alerts.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter
    container_name: prom-node-exp
    ports:
      - "9100:9100"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager
    container_name: prom-alertmanager
    ports:
      - "9093:9093"
    restart: unless-stopped
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml

  telegrambot:
    image: metalmatze/alertmanager-bot
    container_name: prom-telegrambot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
    command:
      - "--store=bolt"
      - "--telegram.token=${BOT_TOKEN}"
      - "--telegram.admin=${CHAT_ID}"
    ports:
      - "8080:8080"
    volumes:
      - bot_data:/data

volumes:
  bot_data:
